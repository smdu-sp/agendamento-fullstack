services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agendamento}
      MYSQL_USER: ${MYSQL_USER:-agendamento}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agendamento}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-agendamento}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/agendamento}
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL_DOCKER:-mysql://agendamento:agendamento@db:3306/agendamento}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c 'npx prisma migrate deploy && npm run start'
    restart: unless-stopped

volumes:
  mysql-data:
