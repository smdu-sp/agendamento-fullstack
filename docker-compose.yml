services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/agendamento}
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    restart: unless-stopped
